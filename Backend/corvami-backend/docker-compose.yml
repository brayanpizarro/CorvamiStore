version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: corvami-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=corvami
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - corvami-network

  backend:
    build: .
    container_name: corvami-backend
    ports:
      - "3000:3000"
    environment:
      # ── BD local (PostgreSQL en Docker) ──────────────────────────────────────
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=corvami
      # ── BD externa Neon (solo lectura: empleados + productos) ─────────────────
      - EXT_DB_HOST=ep-royal-glade-ac55fitc-pooler.sa-east-1.aws.neon.tech
      - EXT_DB_PORT=5432
      - EXT_DB_USER=neondb_owner
      - EXT_DB_PASSWORD=npg_V58gYFmBOPda
      - EXT_DB_NAME=si2
      # ── Aplicación ────────────────────────────────────────────────────────────
      - PORT=3000
      - CLOUDINARY_CLOUD_NAME=def0eymwn
      - CLOUDINARY_API_KEY=298765669195532
      - CLOUDINARY_API_SECRET=7ybs0jIHP5eS2IO-XzcsWpTZPps
      - EMAIL_USER=soporteucenin@gmail.com
      - EMAIL_PASSWORD=xsdkpcsxftgnnfcn
    depends_on:
      - postgres
    networks:
      - corvami-network

volumes:
  postgres-data:

networks:
  corvami-network:
    driver: bridge
